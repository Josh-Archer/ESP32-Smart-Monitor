name: OTA Deploy
# Flash poop-monitor over the air from the shared UECB runner pool
# (runs-on: uecb-shared): an in-cluster pod that routes to the ESP32 LAN
# directly (probed: pod -> 192.168.225.160, 0% loss). mDNS does not resolve
# from a pod, so pass the device LAN IP (DHCP-reserve it).
#
# Uses the HTTP :8267 upload path (upload_http_ota.sh), never espota:
# espota needs the device to TCP-connect BACK to the runner, which fails
# from ephemeral runners. The HTTP path is plain outbound.
#
# Required repo secrets:
#   OTA_PASSWORD                   device OTA password (X-OTA-Password)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: Firmware configuration to build and flash
        required: false
        type: choice
        options:
          - mqtt
          - webserver
          - both
        default: mqtt
      ota_host:
        description: Device LAN IP (mDNS does not resolve from the pod; DHCP-reserve it)
        required: false
        type: string
        default: 192.168.225.160
      ref:
        description: Git ref to build (default branch when empty)
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ota-deploy
  cancel-in-progress: false

jobs:
  ota:
    timeout-minutes: 50
    runs-on: uecb-shared
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.sha }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        shell: bash
        run: pip install platformio

      - name: Prove LAN route to device
        shell: bash
        env:
          OTA_HOST: ${{ inputs.ota_host }}
        run: |
          set -euo pipefail
          ping -c 3 -W 3 "$OTA_HOST"

      - name: Flash via HTTP OTA
        shell: bash
        env:
          OTA_HOST: ${{ inputs.ota_host }}
          OTA_PASSWORD: ${{ secrets.OTA_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${OTA_PASSWORD}" ]; then
            echo "::error::OTA_PASSWORD secret is not set" >&2
            exit 1
          fi
          ./upload_http_ota.sh "${{ inputs.build_type }}"

