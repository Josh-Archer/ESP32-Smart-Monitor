# Vendored from code/home .github/actions/finalize-uecb-allocation/action.yml
# (2026-10-17). Re-sync from there; do not fork behavior here.
name: Finalize UECB allocation
description: >
  Report allocation success, failure, or cancellation to the unified broker so
  scheduler capacity is released immediately. Vendored from the broker
  finalize-allocation action (v0.1.19) and run with python3 for runner images
  that do not ship a `python` binary.

inputs:
  broker_url:
    description: Broker API URL (in-cluster or port-forward).
    required: true
  allocation_id:
    description: Broker allocation id from allocate-uecb-runner.
    required: true
  result:
    description: GitHub job result (success, failure, cancelled) or empty.
    required: false
    default: ""
  state:
    description: Explicit broker terminal state (completed, failed, canceled).
    required: false
    default: ""
  reason:
    description: Optional human-readable reason.
    required: false
    default: ""
  error:
    description: Optional error message when finalizing as failed.
    required: false
    default: ""
  failure_class:
    description: Optional failure class for circuit-breaker accounting.
    required: false
    default: ""
  oidc_audience:
    description: OIDC audience expected by the broker.
    required: false
    default: uecb-broker
  allow_unauthenticated:
    description: Skip OIDC (only for local/dev brokers).
    required: false
    default: "false"
  max_retries:
    description: Number of retries after the first attempt for transient HTTP failures.
    required: false
    default: "5"
  initial_backoff_seconds:
    description: Initial backoff in seconds before the first retry.
    required: false
    default: "1"
  max_backoff_seconds:
    description: Maximum backoff in seconds between retries.
    required: false
    default: "30"

outputs:
  allocation_id:
    description: Broker allocation ID that was finalized.
    value: ${{ steps.finalize.outputs.allocation_id }}
  state:
    description: Terminal state applied (or confirmed) on the allocation.
    value: ${{ steps.finalize.outputs.state }}
  http_status:
    description: HTTP status from the successful complete callback.
    value: ${{ steps.finalize.outputs.http_status }}

runs:
  using: composite
  steps:
    - name: Finalize allocation
      id: finalize
      shell: bash
      env:
        INPUT_BROKER_URL: ${{ inputs.broker_url }}
        INPUT_ALLOCATION_ID: ${{ inputs.allocation_id }}
        INPUT_RESULT: ${{ inputs.result }}
        INPUT_STATE: ${{ inputs.state }}
        INPUT_REASON: ${{ inputs.reason }}
        INPUT_ERROR: ${{ inputs.error }}
        INPUT_FAILURE_CLASS: ${{ inputs.failure_class }}
        INPUT_OIDC_AUDIENCE: ${{ inputs.oidc_audience }}
        INPUT_ALLOW_UNAUTHENTICATED: ${{ inputs.allow_unauthenticated }}
        INPUT_MAX_RETRIES: ${{ inputs.max_retries }}
        INPUT_INITIAL_BACKOFF_SECONDS: ${{ inputs.initial_backoff_seconds }}
        INPUT_MAX_BACKOFF_SECONDS: ${{ inputs.max_backoff_seconds }}
      run: |
        set -euo pipefail
        if command -v python3 >/dev/null 2>&1; then
          python3 "${GITHUB_ACTION_PATH}/finalize.py"
        elif command -v python >/dev/null 2>&1; then
          python "${GITHUB_ACTION_PATH}/finalize.py"
        else
          echo "python3 or python is required to finalize UECB allocations." >&2
          exit 1
        fi
